name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# The mox and Neovim releases these tests run against. Pinned rather than
# tracking `latest`: unpinned, the same commit passes or fails depending on
# what shipped most recently, and a breaking change lands here as a mystery
# failure in an unrelated push. Bump them deliberately when adopting a release.
env:
  MOX_VERSION: v0.10.0
  NVIM_VERSION: v0.12.5

jobs:
  syntax:
    name: Syntax (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install zsh + fish + luajit + lua5.4 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish luajit lua5.4
      - name: Install fish + luajit + lua (macOS)
        if: runner.os == 'macOS'
        run: brew install fish luajit lua
      - run: bash etc/ci/syntax.sh
      - name: Static analysis of the sandbox and commit guards
        if: runner.os == 'Linux'
        run: bash etc/ci/shellcheck.sh
      - run: bash etc/ci/comment-markers.sh
      - run: bash etc/ci/ascii.sh
      - run: bash etc/ci/pins.sh
      - run: bash etc/tests/agent-instructions.sh
      - name: Install mox
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  asset=mox-x86_64-linux.tar.gz ;;
            Linux-aarch64) asset=mox-aarch64-linux.tar.gz ;;
            Darwin-arm64)  asset=mox-aarch64-macos.tar.gz ;;
            Darwin-x86_64) asset=mox-x86_64-macos.tar.gz ;;
            *) echo "unsupported: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          base="https://github.com/sakakibara/mox/releases/download/$MOX_VERSION"
          curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$base/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " $asset$" SHA256SUMS | shasum -a 256 -c -)
          tar xzf "$RUNNER_TEMP/$asset" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash etc/tests/shell_completions.sh

  syntax-powershell:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            ForEach-Object {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
              if ($errors.Count -gt 0) {
                Write-Host "FAIL: $($_.FullName)"
                $errors | ForEach-Object { Write-Host "  $_" }
                $failed++
              }
            }
          if ($failed -gt 0) { exit 1 }
          Write-Host "all PowerShell scripts parse cleanly"

  render:
    name: Compose and apply check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install zsh + fish + luajit + lua5.4 + tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish luajit lua5.4 tmux
      - name: Install fish + luajit + lua + tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install fish luajit lua tmux
      - name: Prepare a home with tpm at its pin for the tmux probe
        run: |
          tag=$(sed -n "s/^set-option -g @plugin 'tmux-plugins\/tpm#\(v[0-9.]*\)'$/\1/p" src/.tmux.conf)
          mkdir -p "$RUNNER_TEMP/tmux-home/.tmux/plugins"
          git clone -q --depth 1 --branch "$tag" https://github.com/tmux-plugins/tpm "$RUNNER_TEMP/tmux-home/.tmux/plugins/tpm"
          echo "RENDER_TMUX_HOME=$RUNNER_TEMP/tmux-home" >> "$GITHUB_ENV"
      - name: Install mox
        run: |
          mkdir -p "$HOME/.local/bin"
          base="https://github.com/sakakibara/mox/releases/download/$MOX_VERSION"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  asset=mox-x86_64-linux.tar.gz ;;
            Linux-aarch64) asset=mox-aarch64-linux.tar.gz ;;
            Darwin-arm64)  asset=mox-aarch64-macos.tar.gz ;;
            Darwin-x86_64) asset=mox-x86_64-macos.tar.gz ;;
            *) echo "unsupported: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$base/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " $asset$" SHA256SUMS | shasum -a 256 -c -)
          tar xzf "$RUNNER_TEMP/$asset" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash etc/ci/render.sh
      # Composing is not writing: the apply path, the attributes contract and
      # a freshly applied tree reporting clean are only exercised here.
      - run: bash etc/ci/apply.sh

  nvim-tests:
    name: Nvim tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: nvim-linux-x86_64
            sha256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
          - os: macos-latest
            asset: nvim-macos-arm64
            sha256: 65fb000099e47ca1b762584c484cc833f40e30851a0ec450d4174e16317c1f9b
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Neovim
        run: |
          curl -fsSL "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/${{ matrix.asset }}.tar.gz" -o nvim.tar.gz
          echo "${{ matrix.sha256 }}  nvim.tar.gz" | shasum -a 256 -c -
          tar xzf nvim.tar.gz
          echo "$PWD/${{ matrix.asset }}/bin" >> "$GITHUB_PATH"
      - name: Build CSS treesitter parser
        # detect_spec's "uses TS for CSS buffers" test exercises the TS code
        # path; without a css parser installed nvim falls back to regex and
        # over-captures the comment color, so the assertion fails. Compile the
        # upstream tree-sitter-css source (parser + external scanner) into
        # nvim's runtime parser dir.
        run: |
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-css /tmp/tree-sitter-css
          mkdir -p "$HOME/.local/share/nvim/site/parser"
          gcc -O2 -shared -fPIC -I /tmp/tree-sitter-css/src \
            /tmp/tree-sitter-css/src/parser.c \
            /tmp/tree-sitter-css/src/scanner.c \
            -o "$HOME/.local/share/nvim/site/parser/css.so"
      - name: Run nvim test suite
        run: |
          cd src/.config/nvim
          nvim --headless -l tests/run.lua
      - name: Smoke-load actual config (cold start with plugin install)
        run: |
          # Point nvim at a *copy* of the mox-source nvim config so
          # vim.pack's lockfile (and any other side-effect writes) land in
          # a throwaway dir, not the repo. Catches "init.lua references a
          # removed plugin" / "lib/X.lua has a typo" style regressions
          # that the unit tests miss. Plugin install pulls from upstream;
          # transient flakes will fail here.
          SMOKE_DIR=$(mktemp -d)
          cp -r src/.config "$SMOKE_DIR/"
          export XDG_CONFIG_HOME="$SMOKE_DIR/.config"
          export XDG_DATA_HOME="$SMOKE_DIR/data"
          export XDG_CACHE_HOME="$SMOKE_DIR/cache"
          export XDG_STATE_HOME="$SMOKE_DIR/state"
          nvim --headless +q

  theme-tests-bash:
    name: Theme tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: bash etc/tests/theme.sh

  bash-lib-tests:
    name: Bash lib tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install mox (used by dotfiles wrapper tests)
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  asset=mox-x86_64-linux.tar.gz ;;
            Linux-aarch64) asset=mox-aarch64-linux.tar.gz ;;
            Darwin-arm64)  asset=mox-aarch64-macos.tar.gz ;;
            Darwin-x86_64) asset=mox-x86_64-macos.tar.gz ;;
            *) echo "unsupported: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          base="https://github.com/sakakibara/mox/releases/download/$MOX_VERSION"
          curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$base/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " $asset$" SHA256SUMS | shasum -a 256 -c -)
          tar xzf "$RUNNER_TEMP/$asset" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: every suite under etc/tests, except the ones another job runs
        run: |
          for t in etc/tests/*.sh; do
            case "${t##*/}" in agent-instructions.sh|theme.sh|shell_completions.sh|agent_sandbox_isolation.sh) continue ;; esac
            echo "== $t"
            bash "$t" || exit 1
          done

  pwsh-tests:
    name: PowerShell tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install mox (used by dotfiles_wrapper smoke tests)
        shell: pwsh
        # Pull the pinned release binary directly: a single archive download
        # avoids scoop's and winget's cold start.
        run: |
          $base = "https://github.com/sakakibara/mox/releases/download/$env:MOX_VERSION"
          $zip = "$env:RUNNER_TEMP/mox-x86_64-windows.zip"
          $sums = "$env:RUNNER_TEMP/SHA256SUMS"
          $dest = "$env:RUNNER_TEMP/mox"
          Invoke-WebRequest "$base/mox-x86_64-windows.zip" -OutFile $zip
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile $sums
          $want = (Get-Content $sums | Where-Object { $_ -match ' mox-x86_64-windows\.zip$' }) -replace ' .*$', ''
          $got = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if (-not $want -or $got -ne $want) { throw "mox-x86_64-windows.zip: sha256 $got, SHA256SUMS says '$want'" }
          Expand-Archive $zip -DestinationPath $dest
          Add-Content $env:GITHUB_PATH $dest
      - name: every suite under etc/tests
        shell: pwsh
        run: |
          foreach ($t in Get-ChildItem etc/tests -Filter *.ps1 | Sort-Object Name) {
            Write-Host "== $($t.Name)"
            pwsh -NoProfile -File $t.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  validate-packages-darwin:
    name: Validate packages (Homebrew)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: brew update
      - run: bash etc/ci/validate-packages.sh darwin

  validate-packages-fedora:
    name: Validate packages (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v6
      - run: dnf -y check-update || true
      - run: bash etc/ci/validate-packages.sh fedora

  validate-packages-debian:
    name: Validate packages (Debian)
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - uses: actions/checkout@v6
      - run: apt-get update
      - run: bash etc/ci/validate-packages.sh debian

  validate-packages-arch:
    name: Validate packages (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v6
      - run: pacman -Syu --noconfirm
      - run: bash etc/ci/validate-packages.sh arch

  validate-packages-suse:
    name: Validate packages (openSUSE)
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - run: zypper --non-interactive install -y bash git tar
      - uses: actions/checkout@v6
      - run: zypper --non-interactive refresh
      - run: bash etc/ci/validate-packages.sh suse

  sandbox-isolation:
    name: Sandbox host-tamper gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The agent versions live in the Dockerfile's ARGs and nowhere else, so
      # this gate judges exactly the image a machine builds. The drift
      # workflow is the one that overrides them to `latest`.
      - name: Build the sandbox image
        run: docker build -t agent-sandbox:latest etc/sandbox
      - name: Host-tamper gate
        run: bash etc/tests/agent_sandbox_isolation.sh
