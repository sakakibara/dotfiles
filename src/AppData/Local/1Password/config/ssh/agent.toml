# mox: when use_1password_ssh_agent=true and os=windows
# Personal-account signing key (Private/default vault) - on every machine.
[[ssh-keys]]
item = "GitHub Signing Key (sakakibara)"
# mox: when profile=work and onepassword_signing_item

# Work-account signing key - work machines only.
[[ssh-keys]]
item = "<machine.onepassword_signing_item>"
# mox: when onepassword_signing_vault
vault = "<machine.onepassword_signing_vault>"
# mox: end
# mox: end
# mox: for id in "data/git_identities.toml"
# mox: when id.onepassword_item

[[ssh-keys]]
item = "<id.onepassword_item>"
# mox: when id.onepassword_vault
vault = "<id.onepassword_vault>"
# mox: end
# mox: end
# mox: end
# mox: end
