# mox: own tui.keymap.global
# mox: own tui.keymap.pager
# mox: own tui.status_line
# mox: own tui.keymap.composer
# mox: own tui.keymap.editor
# mox: own sandbox_workspace_write.writable_roots
# mox: own sandbox_mode
# mox: own approval_policy
# mox: own approvals_reviewer
# mox: own check_for_update_on_startup
# mox: check "scripts/check/codex-config"
# mox: when tool=codex
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
check_for_update_on_startup = false
[tui]
status_line = ["model-with-reasoning", "project-name", "git-branch", "context-used", "five-hour-limit", "weekly-limit"]
[tui.keymap.global]
open_transcript = "ctrl-shift-t"
open_external_editor = "ctrl-shift-g"
copy = "ctrl-shift-o"
[tui.keymap.pager]
close_transcript = ["ctrl-t", "ctrl-shift-t"]
[tui.keymap.composer]
submit = ["enter", "ctrl-j", "ctrl-m"]
[tui.keymap.editor]
insert_newline = ["shift-enter", "alt-enter", "ctrl-shift-j"]
# mox: when tool=holt
[sandbox_workspace_write]
writable_roots = ["<secret:cmd:holt config | sed -n 's/^code_root = //p'>", "<secret:cmd:holt config | sed -n 's/^synced_root = //p'>"]
# mox: end
