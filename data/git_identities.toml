# Per-account git identities. This committed file declares ZERO identities, so a
# machine with none composes to an empty include and no id-*.inc files.
#
# Real (employer-specific) identities are machine-local and NEVER committed: put
# them in the mox private layer at <MOX_STATE_DIR>/private/data/git_identities.toml,
# which shadows this file. Each account is a [[git_identities]] entry:
#
#   [[git_identities]]
#   slug              = "acme"                  # filename-safe id
#   email             = "you@acme.com"          # commit identity
#   match_urls        = ["https://github.com/acme/**", "git@github.com:acme/**", "ssh://git@github.com/acme/**"]
#   name              = "Your Name"             # optional
#   signing_key       = "ssh-ed25519 AAAA..."   # optional public key; signing needs it AND onepassword_item
#   onepassword_item  = "Acme Signing Key"      # optional; exposes the key through the 1Password agent
#   onepassword_vault = "Acme"                  # optional; vault holding onepassword_item
#   gh_account        = "your-acme-login"       # optional; account-token picks the gh/HTTPS account
#
# identities.local.inc routes each match_urls glob to id-<slug>.inc (generated
# by src/.config/git/id-leaves.gen); ~/.config/git/config includes
# identities.local.inc. A signing_key is also listed in allowed_signers, and
# with onepassword_item in the 1Password agent config, so the identity can
# sign and be verified; with a key but no item the leaf turns signing off,
# since a key the agent does not hold fails every commit.
git_identities = []
