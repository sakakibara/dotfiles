# Single source of truth for lazily generated shell completions.
# Composed by mox into one stub per tool in .config/fish/completions/
# and .zcomp/. A stub asks the installed tool for its completion script
# on the first completion request of a session, so completions always
# match the installed version and cost nothing at shell startup. A tool
# missing on a machine makes its stub a silent no-op.
#
# Each entry is a [[completions]] table with:
#   name          the command being completed
#   fish          command emitting the fish completion script
#   zsh           command emitting the zsh completion script
#   zsh_dispatch  function to call when the zsh script only registers a
#                 compdef and does not dispatch the current request

[[completions]]
name = "herdr"
fish = "herdr completion fish"
zsh = "herdr completion zsh"

[[completions]]
name = "mox"
fish = "mox completion fish"
zsh = "mox completion zsh"
zsh_dispatch = "_mox_complete"
