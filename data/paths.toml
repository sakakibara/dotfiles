# Single source of truth for PATH. Composed by mox data loops into
# .config/fish/conf.d/paths.fish (fish) and .config/zsh/paths.zsh (zsh).
#
# Each entry is a [[paths]] table with:
#   dir      directory to add; captures allowed (e.g. <machine.brew_prefix>/bin)
#   when     optional executable name; entry is rendered only if on PATH at
#            apply time (the abbreviations idiom)
#   shells   optional list, default ["zsh", "fish"]
#   prepend  optional bool; true prepends ahead of inherited PATH (default:
#            append). Never written false -- omit the field instead.
#
# Row order is PATH order within each of the prepend/append groups. Both
# composed fragments existence-check a row's directory at shell start (a
# directory that does not exist is silently skipped) -- uniform across
# shells and rows, regardless of whether a row also carries `when`.

[[paths]]
# Before the pnpm home dir: a binary present in both must resolve to the
# bin copy, which is where current pnpm installs land.
# pnpm's own installer adds this dir to fish only; zsh has no equivalent.
dir = "$HOME/.local/share/pnpm/bin"
prepend = true
shells = ["fish"]

[[paths]]
dir = "$HOME/.local/share/pnpm"
prepend = true

[[paths]]
# Ghostty's CLI dir, previously injected by its installer into fish's
# universal fish_user_paths (now cleared; this row is its managed home).
dir = "/Applications/Ghostty.app/Contents/MacOS"
prepend = true
shells = ["fish"]

[[paths]]
# Holds the gh shim, which must shadow brew's gh -- kept first among the
# plain tool-home rows below.
dir = "$HOME/.local/bin"
prepend = true

[[paths]]
dir = "$HOME/.cargo/bin"
prepend = true

[[paths]]
dir = "$HOME/.nimble/bin"
prepend = true

[[paths]]
dir = "$HOME/.fzf/bin"
prepend = true

[[paths]]
dir = "$HOME/.go/bin"
prepend = true

[[paths]]
dir = "$HOME/.config/emacs/bin"
prepend = true

[[paths]]
dir = "<machine.brew_prefix>/bin"
prepend = true
when = "brew"

[[paths]]
dir = "<machine.brew_prefix>/sbin"
prepend = true
when = "brew"
