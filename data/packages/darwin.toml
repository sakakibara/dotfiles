# macOS packages. A tap-qualified name (owner/tap/formula) names its own tap
# and is the decision to trust it; mox taps and trusts that one formula.
backend = "brew"
when = "os=darwin"

# Homebrew's own installer at a fixed commit. mox fetches it, refuses to run
# it unless it hashes to this digest, and only then installs Homebrew -- so a
# fresh mac needs mox and this repo, nothing else.
[[bootstrap]]
url = "https://raw.githubusercontent.com/Homebrew/install/c8188c1d48d77234a458b944d1d1b750f015a1c4/install.sh"
sha256 = "12479a24be3f5307eecac7cde670fad7118640f031229e964f544b1367b52a41"

